name: openproject-fa-staging

x-app: &app
  image: "${OPENPROJECT_FA_IMAGE:?Set OPENPROJECT_FA_IMAGE}"
  environment: &app-environment
    RAILS_ENV: production
    DATABASE_URL: "postgres://openproject_fa_stage:${OPENPROJECT_FA_STAGE_DB_PASSWORD:?Set a staging database password}@db/openproject_fa_stage?pool=20"
    SECRET_KEY_BASE: "${OPENPROJECT_FA_STAGE_SECRET_KEY_BASE:?Set a staging secret key}"
    OPENPROJECT_HOST__NAME: "localhost:18080"
    OPENPROJECT_HTTPS: "false"
    OPENPROJECT_HSTS: "false"
    OPENPROJECT_DEFAULT__LANGUAGE: "fa"
    OPENPROJECT_APP__TITLE: "سامانه جامع مدیریت پروژه"
    OPENPROJECT_SOFTWARE__NAME: "سامانه جامع مدیریت پروژه"
    OPENPROJECT_SEED__ADMIN__USER__NAME: "مدیر سامانه جامع مدیریت پروژه"
    OPENPROJECT_SEED__ADMIN__USER__PASSWORD: "${OPENPROJECT_FA_STAGE_ADMIN_PASSWORD:?Set a staging admin password}"
    OPENPROJECT_SEED__ADMIN__USER__PASSWORD__RESET: "false"
    OPENPROJECT_CACHE__MEMCACHE__SERVER: "cache:11211"
    OPENPROJECT_RAILS__CACHE__STORE: memcache
    OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__URL: ""
    IMAP_ENABLED: "false"
    MIGRATE: "false"
    OPENPROJECT_WEB_WORKERS: "1"
  volumes:
    - opdata:/var/openproject/assets
  networks:
    - staging
  depends_on:
    db:
      condition: service_healthy
    cache:
      condition: service_started

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: openproject_fa_stage
      POSTGRES_USER: openproject_fa_stage
      POSTGRES_PASSWORD: "${OPENPROJECT_FA_STAGE_DB_PASSWORD:?Set a staging database password}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - staging
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U openproject_fa_stage -d openproject_fa_stage"]
      interval: 5s
      timeout: 3s
      retries: 30
  cache:
    image: memcached:1.6-alpine
    networks:
      - staging
  seeder:
    <<: *app
    command: ["./docker/prod/seeder"]
  web:
    <<: *app
    command: ["./docker/prod/web"]
    networks:
      - staging
      - browser
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: [CMD, curl, --fail, "http://localhost:8080/health_checks/default"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
  worker:
    <<: *app
    command: ["./docker/prod/worker"]
  rails-tests:
    image: openproject-fa-rails-tests:18.0.0-d0d7ca836aa5
    profiles: [validation]
    environment:
      RAILS_ENV: test
      DISABLE_SPRING: "1"
      DATABASE_URL: "postgres://openproject_fa_stage:${OPENPROJECT_FA_STAGE_DB_PASSWORD:?Set a staging database password}@db/openproject_fa_test?pool=20"
      SECRET_KEY_BASE: "${OPENPROJECT_FA_STAGE_SECRET_KEY_BASE:?Set a staging secret key}"
    volumes:
      - ../../config/locales:/app/config/locales:ro
      - ../../modules/auth_saml/config/locales:/app/modules/auth_saml/config/locales:ro
      - ../../modules/avatars/config/locales:/app/modules/avatars/config/locales:ro
      - ../../modules/backlogs/config/locales:/app/modules/backlogs/config/locales:ro
      - ../../modules/bim/config/locales:/app/modules/bim/config/locales:ro
      - ../../modules/boards/config/locales:/app/modules/boards/config/locales:ro
      - ../../modules/calendar/config/locales:/app/modules/calendar/config/locales:ro
      - ../../modules/documents/config/locales:/app/modules/documents/config/locales:ro
      - ../../modules/github_integration/config/locales:/app/modules/github_integration/config/locales:ro
      - ../../modules/gitlab_integration/config/locales:/app/modules/gitlab_integration/config/locales:ro
      - ../../modules/job_status/config/locales:/app/modules/job_status/config/locales:ro
      - ../../modules/ldap_departments/config/locales:/app/modules/ldap_departments/config/locales:ro
      - ../../modules/ldap_groups/config/locales:/app/modules/ldap_groups/config/locales:ro
      - ../../modules/meeting/config/locales:/app/modules/meeting/config/locales:ro
      - ../../modules/openid_connect/config/locales:/app/modules/openid_connect/config/locales:ro
      - ../../modules/recaptcha/config/locales:/app/modules/recaptcha/config/locales:ro
      - ../../modules/reporting/config/locales:/app/modules/reporting/config/locales:ro
      - ../../modules/resource_management/config/locales:/app/modules/resource_management/config/locales:ro
      - ../../modules/storages/config/locales:/app/modules/storages/config/locales:ro
      - ../../modules/team_planner/config/locales:/app/modules/team_planner/config/locales:ro
      - ../../modules/two_factor_authentication/config/locales:/app/modules/two_factor_authentication/config/locales:ro
