    synchronized_filters:
      add_new: 'Add synchronized LDAP filter'
      destroy:
        confirmation: "If you continue, the synchronized filter %{name} and all groups %{groups_count} created through it will be removed."
        heading: 'Remove synchronized filter %{name}?'
        removed_groups: "Warning: This will remove the following groups from سامانه جامع مدیریت پروژه and remove it from all projects!"
        title: 'Remove synchronized filter %{name}'
        verification_html: "Enter the filter name %{name} to verify the deletion."
      form:
        base_dn_text: >
          Enter the search base DN to use for this filter. It needs to be below the base DN of the selected LDAP connection.

          Leave this option empty to reuse the base DN of the connection
        filter_string_text: 'Enter the RFC4515 LDAP filter that returns groups in your LDAP to synchronize with سامانه جامع مدیریت پروژه.'
        group_name_attribute_text: 'Enter the attribute of the LDAP group used for setting the سامانه جامع مدیریت پروژه group name.'
        member_lookup_attribute_text: >
          Leave empty to use the default reverse lookup: سامانه جامع مدیریت پروژه searches for users whose memberOf attribute matches the group DN.
          This requires the memberOf attribute to be present on user entries (Active Directory, OpenLDAP with memberof overlay).

          Set this to the attribute name on group entries that lists member DNs to use forward lookup instead.
          Examples: "uniqueMember" (groupOfUniqueNames), "member" (groupOfNames).
          Use this for LDAP servers that do not maintain the memberOf attribute on user entries.

      label_n_groups_found:
        one: "1 group found by the filter"
        other: "%{count} groups found by the filter"
        zero: "No groups were found by the filter"
      plural: 'LDAP Group synchronization filters'
      singular: 'LDAP Group synchronization filter'
    synchronized_groups:
      add_new: 'Add synchronized LDAP group'
      destroy:
        confirmation: "If you continue, the synchronized group %{name} and all %{users_count} users synchronized through it will be removed."
        heading: 'Remove synchronized group %{name}?'
        info: "The سامانه جامع مدیریت پروژه group itself and members added outside this LDAP synchronization will not be removed."
        title: 'Remove synchronized group %{name}'
      form:
        auth_source_text: 'Select which LDAP connection should be used.'
        dn_text: 'Enter the full DN of the group in LDAP'
        group_text: 'Select an existing سامانه جامع مدیریت پروژه group that members of the LDAP group shall be synchronized with'
        sync_users_text: >
          If you enable this option, found users will also be automatically created in سامانه جامع مدیریت پروژه.
          Without it, only existing accounts in سامانه جامع مدیریت پروژه will be added to groups.
      help_text_html: |
        This module allows you to set up a synchronization between LDAP and سامانه جامع مدیریت پروژه groups.
        <br/>
        By default, سامانه جامع مدیریت پروژه uses <strong>reverse lookup</strong>: it searches for users whose <em>memberOf</em> attribute matches the group DN.
        This requires the <em>memberOf</em> attribute to be present on user entries (Active Directory, OpenLDAP with memberof overlay).
        <br/>
        If your LDAP server does not maintain <em>memberOf</em> on user entries (e.g. it uses <em>groupOfUniqueNames</em> with <em>uniqueMember</em>),
        you can configure <strong>forward lookup</strong> by setting the <em>Group member attribute</em> on the synchronization filter.
        <br/>
        Groups are synchronized hourly through a cron job.
        [Please see our documentation on this topic](docs_url).

      no_members: 'This group has no synchronized members yet.'
      no_results: 'No synchronized groups found.'
      plural: 'Synchronized LDAP groups'
      singular: 'Synchronized LDAP group'
      upsell:
        description: 'Take advantage of synchronised LDAP groups to manage users, change their permissions and facilitate user management across groups.'
